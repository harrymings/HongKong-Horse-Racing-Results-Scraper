name: Data integrity tests
on: [push, pull_request]
jobs:
  offline-and-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hkjc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:test@localhost:5432/hkjc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q scraper_incremental.py dashboard.py ingest.py api.py
      - run: ruff check --select E9,F63,F7,F82 .
      - run: python -m pytest -q
